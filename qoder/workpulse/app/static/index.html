<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkPulse · 周报与项目记忆工作台</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23C2410C'/><path d='M22 62 L38 40 L52 56 L68 30' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="19" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M5 20V10M11 20V4M17 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3v.5A2.5 2.5 0 0 0 4 10c0 .8.4 1.5 1 2-.6.5-1 1.2-1 2a2.5 2.5 0 0 0 2 2.45V17a3 3 0 0 0 3 3h1V4zM15 4a3 3 0 0 1 3 3v.5A2.5 2.5 0 0 1 20 10c0 .8-.4 1.5-1 2 .6.5 1 1.2 1 2a2.5 2.5 0 0 1-2 2.45V17a3 3 0 0 1-3 3h-1V4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-4 5 4 5M16 7l4 5-4 5M13 5l-2 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" fill="currentColor"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 15.5L9 8.5l4 4.5 7-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <div class="brand-name">WorkPulse</div>
        <div class="brand-sub">周报与项目记忆台</div>
      </div>
    </div>

    <label class="project-picker">
      <span>当前项目</span>
      <select id="project-select"></select>
    </label>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="overview"><svg><use href="#i-grid"/></svg><span>概览</span></button>
      <button class="nav-item" data-view="search"><svg><use href="#i-search"/></svg><span>混合检索</span></button>
      <button class="nav-item" data-view="docs"><svg><use href="#i-doc"/></svg><span>资料库</span></button>
      <button class="nav-item" data-view="tasks"><svg><use href="#i-task"/></svg><span>任务看板</span><em id="badge-open-tasks"></em></button>
      <button class="nav-item" data-view="report"><svg><use href="#i-report"/></svg><span>周报生成</span></button>
      <button class="nav-item" data-view="memory"><svg><use href="#i-brain"/></svg><span>长期记忆</span><em id="badge-memory"></em></button>
      <button class="nav-item" data-view="evidence"><svg><use href="#i-code"/></svg><span>技术证据</span></button>
    </nav>

    <div class="side-status" id="side-status">
      <div class="status-row"><i class="dot" id="dot-seekdb"></i><span>seekdb</span><b id="txt-seekdb">…</b></div>
      <div class="status-row"><i class="dot" id="dot-pc"></i><span>PowerContext</span><b id="txt-pc">…</b></div>
      <div class="status-row muted"><span id="txt-embed">…</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">概览</h1>
        <p id="view-sub" class="sub">项目状态、最近资料与待办一屏掌握</p>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="btn-refresh">刷新</button>
        <button class="btn primary" id="btn-ingest"><svg><use href="#i-plus"/></svg>导入资料</button>
      </div>
    </header>

    <section class="view" id="view-overview"></section>
    <section class="view" id="view-search"></section>
    <section class="view" id="view-docs"></section>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-report"></section>
    <section class="view" id="view-memory"></section>
    <section class="view" id="view-evidence"></section>
  </main>
</div>

<div class="modal" id="ingest-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>导入资料</h2>
      <button class="icon-btn" data-close-modal>✕</button>
    </div>
    <form id="ingest-form" class="form">
      <div class="grid-2">
        <label>标题<input name="title" required placeholder="例：10-22 支付中台周会纪要" /></label>
        <label>资料类型
          <select name="doc_type">
            <option value="minutes">会议纪要</option>
            <option value="chat">聊天记录</option>
            <option value="doc">文档</option>
            <option value="task">任务清单</option>
            <option value="note">随手记</option>
          </select>
        </label>
      </div>
      <div class="grid-2">
        <label>日期<input name="doc_date" placeholder="2026-10-22（留空=今天）" /></label>
        <label>来源<input name="source_name" placeholder="企微群 / 飞书文档 / 线下会议" /></label>
      </div>
      <label>正文<textarea name="text" rows="9" placeholder="粘贴会议纪要、聊天记录或文档正文…"></textarea></label>
      <div class="form-actions">
        <label class="check"><input type="checkbox" name="remember" checked /> 同时把决策/进展写入 PowerContext 长期记忆</label>
        <div class="spacer"></div>
        <button type="button" class="btn ghost" data-close-modal>取消</button>
        <button type="submit" class="btn primary">导入并索引</button>
      </div>
    </form>
    <div class="modal-sep"><span>或者上传文件（.txt / .md / .csv，UTF-8 或 GBK）</span></div>
    <form id="upload-form" class="form row">
      <input type="file" name="file" accept=".txt,.md,.csv,text/plain" required />
      <select name="doc_type">
        <option value="doc">文档</option>
        <option value="minutes">会议纪要</option>
        <option value="chat">聊天记录</option>
      </select>
      <button type="submit" class="btn">上传并索引</button>
    </form>
    <div class="ingest-result" id="ingest-result"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
